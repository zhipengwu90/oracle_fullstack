# Host nginx site config for this project.
# Install on the VM as: /etc/nginx/sites-available/app.wuapp.app
# (symlinked into /etc/nginx/sites-enabled/), then: sudo nginx -t && sudo systemctl reload nginx
#
# The Docker containers bind to loopback only:
#   backend  -> 127.0.0.1:8000   (Django + gunicorn)
#   frontend -> 127.0.0.1:3000   (Next.js)

server {
    listen 443 ssl;
    server_name app.wuapp.app;

    ssl_certificate     /etc/letsencrypt/live/app.wuapp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.wuapp.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # Django: admin, REST API, DRF browsable-API login, static files.
    # (/|$) so "/admin" (no trailing slash) also routes here, not to the frontend.
    location ~ ^/(admin|api|api-auth|static)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name app.wuapp.app;
    return 301 https://$host$request_uri;
}
