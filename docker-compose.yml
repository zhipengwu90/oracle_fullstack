services:
  backend:
    build:
      context: ./oracle-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA:-public}
    extra_hosts:
      # Lets the container resolve the Docker host's own IP, so it can
      # reach PostgreSQL running directly on the Oracle VM (not in Docker).
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    networks:
      - appnet

  frontend:
    build:
      context: ./oracle-nextjs
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server-side fetches in Next.js talk to the backend container directly.
      BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # enable once TLS certs are set up (see README)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
