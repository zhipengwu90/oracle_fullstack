name: Deploy to Oracle VM

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

# Never run two deploys at once; don't cancel one that's mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # optional: add required reviewers on this env for an approval gate
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/apps/oracle_instance

            echo "==> Pulling latest code"
            git pull --ff-only

            echo "==> Rebuilding and restarting containers"
            docker compose up -d --build --remove-orphans

            echo "==> Running Django migrations"
            docker compose exec -T backend python manage.py migrate --noinput

            echo "==> Cleaning up old images"
            docker image prune -f

            echo "==> Status"
            docker compose ps

            echo "==> Health check (backend container via loopback)"
            curl -fsS http://127.0.0.1:8000/api/health/ && echo
