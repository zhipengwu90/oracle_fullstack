<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1b1b1b"/>
  <!-- Grid lines -->
  <line x1="0" y1="125" x2="800" y2="125" stroke="#ffffff10" stroke-width="1"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#ffffff10" stroke-width="1"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#ffffff10" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="500" stroke="#ffffff10" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="500" stroke="#ffffff10" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="500" stroke="#ffffff10" stroke-width="1"/>

  <!-- DNA helix left strand -->
  <path d="M 90 160 C 130 180, 170 200, 210 220 C 170 240, 130 260, 90 280 C 130 300, 170 320, 210 340" stroke="#B63E96" stroke-width="2.5" fill="none"/>
  <!-- DNA helix right strand -->
  <path d="M 210 160 C 170 180, 130 200, 90 220 C 130 240, 170 260, 210 280 C 170 300, 130 320, 90 340" stroke="#58E6D9" stroke-width="2.5" fill="none"/>
  <!-- Rungs -->
  <line x1="106" y1="188" x2="194" y2="188" stroke="#ffffff30" stroke-width="1.5"/>
  <line x1="90" y1="220" x2="210" y2="220" stroke="#ffffff30" stroke-width="1.5"/>
  <line x1="106" y1="252" x2="194" y2="252" stroke="#ffffff30" stroke-width="1.5"/>
  <line x1="90" y1="280" x2="210" y2="280" stroke="#ffffff30" stroke-width="1.5"/>
  <line x1="106" y1="312" x2="194" y2="312" stroke="#ffffff30" stroke-width="1.5"/>

  <!-- Schema table -->
  <rect x="260" y="160" width="470" height="200" rx="10" fill="#2a2a2a" stroke="#ffffff20" stroke-width="1"/>
  <!-- Header row -->
  <rect x="260" y="160" width="470" height="36" rx="10" fill="#B63E9625"/>
  <rect x="260" y="184" width="470" height="12" fill="#B63E9625"/>
  <text x="290" y="184" font-family="monospace" font-size="12" fill="#B63E96">sample_id</text>
  <text x="420" y="184" font-family="monospace" font-size="12" fill="#B63E96">locus</text>
  <text x="530" y="184" font-family="monospace" font-size="12" fill="#B63E96">allele_1</text>
  <text x="650" y="184" font-family="monospace" font-size="12" fill="#B63E96">allele_2</text>

  <!-- Data rows -->
  <text x="290" y="215" font-family="monospace" font-size="11" fill="#ffffff80">S-2019-001</text>
  <text x="420" y="215" font-family="monospace" font-size="11" fill="#ffffff80">Ots_94857</text>
  <text x="530" y="215" font-family="monospace" font-size="11" fill="#58E6D9">142</text>
  <text x="650" y="215" font-family="monospace" font-size="11" fill="#58E6D9">146</text>

  <text x="290" y="240" font-family="monospace" font-size="11" fill="#ffffff80">S-2019-002</text>
  <text x="420" y="240" font-family="monospace" font-size="11" fill="#ffffff80">Ots_94857</text>
  <text x="530" y="240" font-family="monospace" font-size="11" fill="#58E6D9">142</text>
  <text x="650" y="240" font-family="monospace" font-size="11" fill="#58E6D9">142</text>

  <text x="290" y="265" font-family="monospace" font-size="11" fill="#ffffff50">S-1998-017</text>
  <text x="420" y="265" font-family="monospace" font-size="11" fill="#ffffff50">Ots_94857</text>
  <text x="530" y="265" font-family="monospace" font-size="11" fill="#ffffff50">138</text>
  <text x="650" y="265" font-family="monospace" font-size="11" fill="#ffffff50">144</text>

  <line x1="260" y1="280" x2="730" y2="280" stroke="#ffffff15" stroke-width="1"/>
  <text x="290" y="300" font-family="monospace" font-size="11" fill="#ffffff30">historical format ↑  ·  new format ↓</text>

  <text x="290" y="330" font-family="monospace" font-size="11" fill="#ffffff50">S-2024-103</text>
  <text x="420" y="330" font-family="monospace" font-size="11" fill="#ffffff50">Ots_94857</text>
  <text x="530" y="330" font-family="monospace" font-size="11" fill="#58E6D980">144</text>
  <text x="650" y="330" font-family="monospace" font-size="11" fill="#58E6D980">148</text>

  <!-- "In Progress" badge -->
  <rect x="560" y="368" width="120" height="26" rx="13" fill="#58E6D920" stroke="#58E6D9" stroke-width="1.5"/>
  <text x="620" y="386" font-family="monospace" font-size="11" fill="#58E6D9" text-anchor="middle">In Progress</text>

  <!-- Title -->
  <text x="400" y="90" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Genetic Results Database</text>
  <text x="400" y="118" font-family="monospace" font-size="12" fill="#ffffff60" text-anchor="middle">PostgreSQL · Next.js · TypeScript</text>

  <!-- DFO label -->
  <rect x="310" y="430" width="180" height="30" rx="6" fill="#B63E9620"/>
  <text x="400" y="450" font-family="monospace" font-size="12" fill="#B63E96" text-anchor="middle">Fisheries and Oceans Canada</text>
</svg>
