<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1b1b1b"/>
  <!-- Grid lines -->
  <line x1="0" y1="125" x2="800" y2="125" stroke="#ffffff10" stroke-width="1"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#ffffff10" stroke-width="1"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#ffffff10" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="500" stroke="#ffffff10" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="500" stroke="#ffffff10" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="500" stroke="#ffffff10" stroke-width="1"/>

  <!-- ETL flow diagram -->
  <!-- Source box -->
  <rect x="60" y="190" width="160" height="120" rx="12" fill="#2a2a2a" stroke="#B63E96" stroke-width="2"/>
  <text x="140" y="245" font-family="monospace" font-size="13" fill="#B63E96" text-anchor="middle">Microsoft</text>
  <text x="140" y="263" font-family="monospace" font-size="13" fill="#B63E96" text-anchor="middle">Access DB</text>
  <text x="140" y="285" font-family="monospace" font-size="11" fill="#ffffff60" text-anchor="middle">.accdb upload</text>

  <!-- Arrow 1 -->
  <line x1="220" y1="250" x2="300" y2="250" stroke="#B63E96" stroke-width="2"/>
  <polygon points="300,244 314,250 300,256" fill="#B63E96"/>

  <!-- ETL box -->
  <rect x="314" y="190" width="172" height="120" rx="12" fill="#2a2a2a" stroke="#58E6D9" stroke-width="2"/>
  <text x="400" y="240" font-family="monospace" font-size="13" fill="#58E6D9" text-anchor="middle">R Shiny</text>
  <text x="400" y="258" font-family="monospace" font-size="13" fill="#58E6D9" text-anchor="middle">ETL Engine</text>
  <text x="400" y="280" font-family="monospace" font-size="11" fill="#ffffff60" text-anchor="middle">Extract · Transform</text>

  <!-- Arrow 2 -->
  <line x1="486" y1="250" x2="566" y2="250" stroke="#58E6D9" stroke-width="2"/>
  <polygon points="566,244 580,250 566,256" fill="#58E6D9"/>

  <!-- Target box -->
  <rect x="580" y="190" width="160" height="120" rx="12" fill="#2a2a2a" stroke="#B63E96" stroke-width="2"/>
  <text x="660" y="245" font-family="monospace" font-size="13" fill="#B63E96" text-anchor="middle">Oracle DB</text>
  <text x="660" y="263" font-family="monospace" font-size="13" fill="#B63E96" text-anchor="middle">Output</text>
  <text x="660" y="285" font-family="monospace" font-size="11" fill="#ffffff60" text-anchor="middle">Ready format</text>

  <!-- Title -->
  <text x="400" y="90" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Data Extraction Tool</text>
  <text x="400" y="118" font-family="monospace" font-size="13" fill="#ffffff60" text-anchor="middle">R · R Shiny · Oracle Database</text>

  <!-- DFO label -->
  <rect x="310" y="390" width="180" height="30" rx="6" fill="#B63E9620"/>
  <text x="400" y="410" font-family="monospace" font-size="12" fill="#B63E96" text-anchor="middle">Fisheries and Oceans Canada</text>
</svg>
