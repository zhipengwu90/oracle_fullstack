<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B63E96" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58E6D9" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="primGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B63E96"/>
      <stop offset="1" stop-color="#8e2f76"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58E6D9"/>
      <stop offset="1" stop-color="#3bb3a8"/>
    </linearGradient>
  </defs>

  <!-- Background glow disc -->
  <circle cx="300" cy="290" r="250" fill="url(#bgGlow)"/>
  <circle cx="300" cy="290" r="250" stroke="#ffffff10" stroke-width="1"/>

  <!-- Orbiting tech dots -->
  <circle cx="78" cy="180" r="5" fill="#58E6D9" opacity="0.7"/>
  <circle cx="520" cy="150" r="4" fill="#B63E96" opacity="0.7"/>
  <circle cx="540" cy="430" r="6" fill="#58E6D9" opacity="0.5"/>
  <circle cx="60" cy="410" r="4" fill="#B63E96" opacity="0.6"/>

  <!-- Floating code chip top-left -->
  <g transform="translate(70 130)">
    <rect width="120" height="70" rx="10" fill="url(#screen)" stroke="#B63E96" stroke-width="1.5"/>
    <text x="14" y="28" font-family="monospace" font-size="12" fill="#58E6D9">def etl():</text>
    <text x="26" y="46" font-family="monospace" font-size="12" fill="#ffffff80">return df</text>
    <circle cx="105" cy="14" r="3" fill="#B63E96"/>
  </g>

  <!-- Floating chart chip top-right -->
  <g transform="translate(410 120)">
    <rect width="120" height="80" rx="10" fill="url(#screen)" stroke="#58E6D9" stroke-width="1.5"/>
    <rect x="16" y="48" width="14" height="20" rx="2" fill="#B63E96"/>
    <rect x="38" y="36" width="14" height="32" rx="2" fill="#58E6D9"/>
    <rect x="60" y="24" width="14" height="44" rx="2" fill="#B63E96"/>
    <rect x="82" y="40" width="14" height="28" rx="2" fill="#58E6D9"/>
    <text x="16" y="24" font-family="monospace" font-size="10" fill="#ffffff60">analytics</text>
  </g>

  <!-- Desk surface -->
  <rect x="120" y="470" width="360" height="14" rx="6" fill="#333"/>
  <rect x="150" y="484" width="12" height="60" rx="3" fill="#2a2a2a"/>
  <rect x="438" y="484" width="12" height="60" rx="3" fill="#2a2a2a"/>

  <!-- Main monitor -->
  <g transform="translate(190 250)">
    <rect x="-6" y="-6" width="232" height="172" rx="14" fill="#111"/>
    <rect width="220" height="160" rx="10" fill="url(#screen)"/>
    <!-- header bar -->
    <rect width="220" height="26" rx="10" fill="#B63E9625"/>
    <circle cx="16" cy="13" r="4" fill="#B63E96"/>
    <circle cx="30" cy="13" r="4" fill="#58E6D9"/>
    <circle cx="44" cy="13" r="4" fill="#ffffff40"/>
    <!-- db rows -->
    <rect x="16" y="42" width="80" height="8" rx="4" fill="#58E6D9"/>
    <rect x="104" y="42" width="100" height="8" rx="4" fill="#ffffff25"/>
    <rect x="16" y="60" width="60" height="8" rx="4" fill="#ffffff40"/>
    <rect x="84" y="60" width="120" height="8" rx="4" fill="#ffffff20"/>
    <rect x="16" y="78" width="100" height="8" rx="4" fill="#B63E96"/>
    <rect x="124" y="78" width="80" height="8" rx="4" fill="#ffffff20"/>
    <!-- line chart -->
    <polyline points="16,140 50,120 84,128 118,100 152,110 188,84 204,92" fill="none" stroke="#58E6D9" stroke-width="2.5"/>
    <circle cx="118" cy="100" r="3.5" fill="#58E6D9"/>
    <circle cx="188" cy="84" r="3.5" fill="#B63E96"/>
  </g>
  <!-- monitor stand -->
  <rect x="294" y="410" width="12" height="32" fill="#2a2a2a"/>
  <rect x="270" y="440" width="60" height="8" rx="4" fill="#333"/>

  <!-- Professional figure -->
  <g transform="translate(300 300)">
    <!-- chair back -->
    <rect x="-46" y="120" width="92" height="80" rx="20" fill="#262626"/>
    <!-- body / torso -->
    <path d="M -44 200 Q -44 120 0 116 Q 44 120 44 200 Z" fill="url(#primGrad)"/>
    <!-- collar -->
    <path d="M -16 124 L 0 150 L 16 124 Z" fill="#f5f5f5" opacity="0.9"/>
    <!-- neck -->
    <rect x="-9" y="96" width="18" height="26" rx="6" fill="#caa07a"/>
    <!-- head -->
    <circle cx="0" cy="78" r="26" fill="#e0b48c"/>
    <!-- hair -->
    <path d="M -26 74 Q -28 48 0 48 Q 28 48 26 74 Q 18 60 0 60 Q -18 60 -26 74 Z" fill="#1a1a1a"/>
    <!-- arm to keyboard -->
    <path d="M 40 168 Q 70 180 64 210" fill="none" stroke="url(#primGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Keyboard -->
  <rect x="250" y="500" width="100" height="20" rx="5" fill="#2a2a2a" stroke="#ffffff15"/>
  <line x1="262" y1="510" x2="338" y2="510" stroke="#ffffff20" stroke-width="1"/>

  <!-- baseline -->
  <rect x="90" y="544" width="420" height="3" rx="1.5" fill="#ffffff15"/>
</svg>
